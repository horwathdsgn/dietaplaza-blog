<!-- Primary Meta Tags -->
<title>{{ if .IsHome }}{{ site.Title }} – {{ site.Params.description }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
<meta name="description" content="{{ with .Params.seo.description }}{{ . }}{{ else }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary | truncate 155 }}{{ end }}{{ end }}">
{{ with .Params.seo.keywords }}<meta name="keywords" content="{{ delimit . ", " }}">{{ end }}
<meta name="author" content="{{ with .Params.author }}{{ . }}{{ else }}{{ site.Params.author }}{{ end }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ with .Params.seo.canonical }}{{ . }}{{ else }}{{ .Permalink }}{{ end }}">

<!-- Robots -->
<meta name="robots" content="{{ with .Params.seo.robots }}{{ . }}{{ else }}index, follow{{ end }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary | truncate 155 }}{{ end }}">
<meta property="og:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ index site.Params.images 0 | absURL }}{{ end }}{{ end }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:locale" content="hu_HU">

<!-- Twitter Card -->
<meta name="twitter:card" content="{{ with .Params.twitter_card }}{{ . }}{{ else }}summary_large_image{{ end }}">
<meta name="twitter:url" content="{{ .Permalink }}">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary | truncate 155 }}{{ end }}">
<meta name="twitter:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ index site.Params.images 0 | absURL }}{{ end }}{{ end }}">

<!-- Article specific -->
{{ if .IsPage }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:author" content="{{ with .Params.author }}{{ . }}{{ else }}{{ site.Params.author }}{{ end }}">
{{ range .Params.categories }}<meta property="article:section" content="{{ . }}">
{{ end }}{{ range .Params.tags }}<meta property="article:tag" content="{{ . }}">
{{ end }}{{ end }}
